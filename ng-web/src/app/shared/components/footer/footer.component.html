<!-- Community Logos -->
<div class="px-10 md:px-30 lg:px-40 py-16 grid bg-white">
	<h2
		class="py-4 text-3xl my-4 md:text-left text-center font-bold text-ng-dark-blue capitalize"
	>
		Our 2026 Community Sponsors
	</h2>
	<div
		class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-y-8 gap-x-4 md:gap-x-8 items-center justify-center pb-8"
	>
		@for (partner of partners; track $index) {
		<ng-container>
			<a
				[href]="partner.official_website"
				[ngClass]="
					partner.alt === 'Google for Developers'
						? 'h-20 md:h-24 w-[calc(100%+1rem)] md:w-[calc(100%+2rem)] -mx-2 md:-mx-4'
						: 'h-16 md:h-20 w-full mx-auto'
				"
				class="flex items-center justify-center hover:cursor-pointer hover:saturate-0 hover:rounded-xl hover:shadow-faded-red group-hover:scale-105 group-focus:scale-105 transition-transform duration-500 ease-in-out logo"
				target="_blank"
				rel="noopener"
			>
				<img
					[alt]="partner.alt"
					[src]="partner.logo"
					class="max-h-full max-w-full w-auto h-auto object-contain"
				/>
			</a>
		</ng-container>
		}
	</div>
</div>
<!-- Angular Kenya -->

	>

			<p
				class="flex flex-col justify-between space-y-2 mt-4 text-center md:text-left"
			>
				<a href="mailto:angualrnairobi@gmail.com"
					>angularnairobi&#64;gmail.com</a
				>
				<a href="mailto:angualrnairobi@gmail.com">Angular Kenya</a>
			</p>
		</div>
		<div class="logo order-1 md:order-2">

					class="text-white w-4 md:w-8 h-4 md:h-8"

</footer>
