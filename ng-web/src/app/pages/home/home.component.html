<!-- 2027 coming-soon hero -->
<section class="relative w-full min-h-[calc(100vh-6rem)] flex items-center overflow-hidden">
	<div
		class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(232,67,147,0.18),_transparent_55%),radial-gradient(ellipse_at_bottom_right,_rgba(221,31,47,0.12),_transparent_45%)]"
		aria-hidden="true"
	></div>

	<div class="relative container max-w-screen-sm md:max-w-screen-xl mx-auto px-10 py-20 md:py-28">
		<div class="max-w-3xl mx-auto text-center space-y-8">
			<img
				[src]="logo"
				alt="NG Kenya {{ year }}"
				class="mx-auto w-52 md:w-80"
			/>

			<h1
				class="text-2xl sm:text-3xl md:text-4xl font-bold leading-snug tracking-tight text-white"
			>
				East Africa's Angular conference returns soon
			</h1>

			<p class="text-base md:text-lg text-ng-grey leading-relaxed max-w-2xl mx-auto">
				Dates and venue will be announced soon — stay close to the community
				while we prepare the next chapter.
			</p>

			<div class="flex flex-wrap justify-center gap-4 pt-2">
				<a
					routerLink="/past-events"
					class="py-3 px-6 inline-flex items-center gap-x-2 rounded-full bg-ng-pink text-white font-semibold hover:bg-ng-red transition-colors duration-300"
				>
					Explore past events
				</a>
				<button
					type="button"
					(click)="shopMerch()"
					class="py-3 px-6 inline-flex items-center gap-x-2 rounded-full border border-white/25 text-white font-semibold hover:border-ng-pink hover:text-ng-pink transition-colors duration-300"
				>
					<svg ngKeIcon="external-link" class="size-5"></svg>
					Shop Merch
				</button>
			</div>

			@if (latestPastYear) {
			<p class="text-sm text-ng-white/60 pt-4">
				Missed NG Kenya {{ latestPastYear }}?
				<a
					[routerLink]="['/archive', latestPastYear]"
					class="text-ng-pink hover:underline"
				>
					Browse the archive
				</a>
			</p>
			}
		</div>
	</div>
</section>
